name: image

# Build and publish the operator image from CI rather than a workstation: the
# repo's own GITHUB_TOKEN carries packages:write, while the OAuth tokens a
# developer has on hand do not.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: true

      - name: Verify
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      # GHA cache export needs the docker-container driver; the default docker
      # driver rejects it with "Cache export is not supported".
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The hive-usage sidecar: same repo, same tags, separate image, so the
      # sidecar in the hive pods and the operator can be rolled independently.
      - id: meta-usage
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/hive-usage
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.usage
          push: true
          tags: ${{ steps.meta-usage.outputs.tags }}
          labels: ${{ steps.meta-usage.outputs.labels }}
          cache-from: type=gha,scope=hive-usage
          cache-to: type=gha,mode=max,scope=hive-usage
