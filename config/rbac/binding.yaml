# The namespace lives here, not in config/manager: RBAC is applied first and
# every object in this file is namespaced, so `make deploy` otherwise fails on a
# fresh cluster and succeeds on the second run.
apiVersion: v1
kind: Namespace
metadata:
  name: hive-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hive-operator
  namespace: hive-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hive-operator
subjects:
  - kind: ServiceAccount
    name: hive-operator
    namespace: hive-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hive-operator
---
# Leader election needs coordination leases in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-operator-leader-election
  namespace: hive-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-operator-leader-election
  namespace: hive-system
subjects:
  - kind: ServiceAccount
    name: hive-operator
    namespace: hive-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-operator-leader-election
