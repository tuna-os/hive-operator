---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hive-operator
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - apps
  resources:
  - deployments/scale
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - hive.tunaos.org
  resources:
  - hivehousekeepings
  - hivereleases
  - hivespokes
  - modelladders
  - sharedauths
  - usagepools
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - hive.tunaos.org
  resources:
  - hivehousekeepings/status
  - hivereleases/status
  - hivespokes/status
  - modelladders/status
  - sharedauths/status
  - usagepools/status
  verbs:
  - get
  - patch
  - update
