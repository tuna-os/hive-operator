---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hive-operator
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - pods
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - hive.tunaos.org
  resources:
  - hivespokes
  - modelladders
  - sharedauths
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - hive.tunaos.org
  resources:
  - hivespokes/status
  - modelladders/status
  - sharedauths/status
  verbs:
  - get
  - patch
  - update
