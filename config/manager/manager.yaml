apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-operator
  namespace: hive-system
  labels: {app.kubernetes.io/name: hive-operator}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: hive-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hive-operator}
    spec:
      serviceAccountName: hive-operator
      # The spokes are pinned to the hive node; being co-resident keeps pod exec
      # off the cross-node path.
      nodeSelector: {workload-role: hive}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          image: ghcr.io/tuna-os/hive-operator:sha-a9d8737
          args: ["--metrics-bind-address=:8080", "--dashboard-bind-address=:8082"]
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: dashboard, containerPort: 8082}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hive-operator
  namespace: hive-system
  labels: {app.kubernetes.io/name: hive-operator}
spec:
  selector: {app.kubernetes.io/name: hive-operator}
  ports:
    - {name: metrics, port: 8080, targetPort: 8080}
    - {name: dashboard, port: 8082, targetPort: 8082}
