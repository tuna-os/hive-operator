# One UsagePool per provider ACCOUNT. Observe-only: they measure and publish
# rotation's reading (status.rotationReading: ccleft reduced exactly as
# hive-lib.sh's ccleft_probe, the ConfigMap as fallback) and the pacer's
# verdict (status.pace). The pools rotation reads are hive-rotate.sh's
# PROVIDERS: kiro anthropic openai google meta. The hive-usage (ccusage)
# sidecar is OPTIONAL — without it the windows' consumption stays 0 and
# Ready=False/NoSidecar, but rotationReading and pace are unaffected.
#
# Limits are left empty (learned): consumption is calibrated against the
# provider reading. Readings come from ccleft (hive/ccleft, the provider's own
# remaining/limit/reset per window) and fall back per window to the bash
# probe's hive/hive-provider-usage while ccleft is unavailable. Configure
# `limit` only when the provider documents one.
apiVersion: hive.tunaos.org/v1alpha1
kind: UsagePool
metadata:
  name: anthropic
spec:
  provider: anthropic
  unit: costUSD
  windows:
    - {name: 5h, duration: 5h, readingSlot: slot0}        # ccleft: five_hour
    - {name: weekly, duration: 168h, readingSlot: slot1}  # ccleft: seven_day (model-scoped caps never match)
  reading: {namespace: hive, name: hive-provider-usage}
  ccleft: {url: http://ccleft.hive.svc:9464}
---
apiVersion: hive.tunaos.org/v1alpha1
kind: UsagePool
metadata:
  name: openai
spec:
  provider: openai
  unit: costUSD
  windows:
    # The probe collapses codex's primary/secondary windows to the worse one
    # (weekly while exhausted); calibrate the weekly window from it.
    - {name: weekly, duration: 168h}
  reading: {namespace: hive, name: hive-provider-usage}
  ccleft: {url: http://ccleft.hive.svc:9464}
---
apiVersion: hive.tunaos.org/v1alpha1
kind: UsagePool
metadata:
  name: google
spec:
  provider: google
  unit: costUSD
  windows:
    # agy's "Gemini Models" group has a 5-hour and a weekly limit (ccleft:
    # gemini-5h / gemini-weekly; the "3p" Claude/GPT pool is excluded by
    # scope). The bash reading collapses both into the worse one.
    - {name: 5h, duration: 5h}
    - {name: weekly, duration: 168h}
  reading: {namespace: hive, name: hive-provider-usage}
  ccleft: {url: http://ccleft.hive.svc:9464, scope: gemini}
---
apiVersion: hive.tunaos.org/v1alpha1
kind: UsagePool
metadata:
  name: meta
spec:
  # muse (Meta) has no quota API: ccleft reports `unsupported`, which
  # rotation reads as "-1 no-usage-api" (unmeasured, entry allowed) exactly
  # like hive-rotate.sh. No windows and no ccusage source: the pool exists so
  # rotation's meta reading comes from ccleft like every other provider's.
  provider: meta
  reading: {namespace: hive, name: hive-provider-usage}
  ccleft: {url: http://ccleft.hive.svc:9464}
---
apiVersion: hive.tunaos.org/v1alpha1
kind: UsagePool
metadata:
  name: kiro
spec:
  provider: kiro
  sources: [pi]
  unit: costUSD
  # Kiro Power: 10000 credits a month, reset on the 1st 00:00Z. ccleft reports
  # used/limit/remaining in credits (status.windows[].providerWindow).
  windows:
    - {name: monthly, duration: 744h, ccleftWindow: plan}
  reading: {namespace: hive, name: hive-provider-usage}
  ccleft: {url: http://ccleft.hive.svc:9464}
  # The Kiro credit budget (hive-pace HIVE_PACE_KIRO_* on the live CronJob):
  # every ccleft fetch is a sample (sampleIntervalSeconds 0), burn fitted over
  # the last hour, allowed = remaining / hours-to-reset x 0.85.
  pace:
    sampleIntervalSeconds: 0
    kiroSafety: "0.85"
    kiroHot: "1.0"
    kiroCold: "0.6"
    kiroWindowSeconds: 3600
    kiroMinSamples: 3
    kiroMinSpanSeconds: 1200
