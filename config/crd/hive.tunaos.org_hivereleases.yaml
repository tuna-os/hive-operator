---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: hivereleases.hive.tunaos.org
spec:
  group: hive.tunaos.org
  names:
    kind: HiveRelease
    listKind: HiveReleaseList
    plural: hivereleases
    shortNames:
    - hrel
    singular: hiverelease
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.track
      name: Track
      type: string
    - jsonPath: .status.desired.version
      name: Desired
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.rollout.target
      name: Rolling
      type: string
    - jsonPath: .status.lastResult
      name: Result
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HiveRelease owns the image version of a set of hive Deployments.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HiveReleaseSpec is the desired image policy.
            properties:
              blocklist:
                description: |-
                  Blocklist holds digests (sha256:…) or version labels never to deploy.
                  Digests that fail the gate are added to Status.Blocklist automatically.
                items:
                  type: string
                type: array
              cooldown:
                description: Cooldown blocks starting a new rollout after a rollback.
                  Default 20h.
                type: string
              image:
                description: Image is the default repository, e.g. ghcr.io/hivecommons/hive.
                type: string
              mode:
                allOf:
                - enum:
                  - Observe
                  - Shadow
                  - Enforce
                - enum:
                  - Observe
                  - Shadow
                  - Enforce
                default: Shadow
                description: |-
                  Mode: Observe reports current images only; Shadow also computes and
                  reports the plan; Enforce applies it. Default Shadow.
                type: string
              pin:
                description: |-
                  Pin freezes the desired image: a tag, "sha256:<digest>" or
                  "tag@sha256:<digest>". A pin bypasses the blocklist and the major-version
                  guard, so pinning an older version is how the fleet is rolled back on
                  purpose (through the same canary, gate and soak). It applies to targets
                  that do not override image, track or pin.
                type: string
              pollInterval:
                description: PollInterval is how often the registry is consulted.
                  Default 1h.
                type: string
              soak:
                description: |-
                  Soak is how long each target is watched after its gate passes before the
                  next target is touched. Default 10m.
                type: string
              suspend:
                description: |-
                  Suspend stops all evaluation. An in-progress rollout is left where it is
                  and resumes when unsuspended.
                type: boolean
              targets:
                description: Targets in rollout order. The first is the canary.
                items:
                  description: |-
                    ReleaseTarget is one Deployment whose image this release owns. Targets are
                    rolled strictly in list order; the first is the canary.
                  properties:
                    allowMajorChange:
                      description: |-
                        AllowMajorChange permits moving this target across a major version (v5→v6
                        or back). Without it, or a pin, such a change is Held. This is the guard
                        against the nightly v6→v5 rollback.
                      type: boolean
                    container:
                      type: string
                    deployment:
                      type: string
                    healthURL:
                      description: |-
                        HealthURL is fetched by the operator (HTTP 200 required) as the health
                        gate for non-spoke targets such as the hub. Spoke targets are checked
                        in-pod instead.
                      type: string
                    image:
                      description: Image overrides Spec.Image for this target (e.g.
                        ghcr.io/hivecommons/hive-hub).
                      type: string
                    name:
                      description: Name identifies the target in status and events.
                      type: string
                    namespace:
                      description: |-
                        Namespace, Deployment and Container address a target explicitly. They
                        override what Spoke implies.
                      type: string
                    pin:
                      description: Pin overrides Spec.Pin for this target.
                      type: string
                    spoke:
                      description: |-
                        Spoke names a HiveSpoke. Its namespace is used, with deployment "hive"
                        and container "hive", and the full spoke health gate applies (in-pod
                        /api/health plus the agent placement snapshot).
                      type: string
                    track:
                      description: Track overrides Spec.Track for this target, so
                        the hub can follow its own line.
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              track:
                description: Track is a tag (v6-latest) or, when it starts with "^",
                  a semver tag regex.
                type: string
              window:
                description: Window restricts when a rollout may start. Omit for any
                  time.
                properties:
                  end:
                    description: End is HH:MM local time, exclusive. End before Start
                      wraps midnight.
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                  start:
                    description: Start is HH:MM local time, inclusive.
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                  timeZone:
                    description: TimeZone is an IANA zone name. Default UTC.
                    type: string
                required:
                - end
                - start
                type: object
            required:
            - image
            - targets
            - track
            type: object
          status:
            description: HiveReleaseStatus is the observed state.
            properties:
              blocklist:
                description: Blocklist holds digests that failed the gate.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              desired:
                description: |-
                  Desired is Spec.Image/Track resolved. Targets with overrides carry their
                  own desired image in Targets[].
                properties:
                  digest:
                    description: Digest is the image index digest.
                    type: string
                  pinned:
                    description: Pinned is true when this came from a pin.
                    type: boolean
                  platforms:
                    description: Platforms in the index, os/arch.
                    items:
                      type: string
                    type: array
                  repo:
                    type: string
                  revision:
                    description: Revision is the org.opencontainers.image.revision
                      label.
                    type: string
                  tag:
                    type: string
                  version:
                    description: |-
                      Version is a human label: the semver tag, or <line>-<revision12> for a
                      moving tag (v6-latest → v6-5d26aa998c80).
                    type: string
                required:
                - digest
                - repo
                type: object
              lastCheck:
                format: date-time
                type: string
              lastResult:
                type: string
              lastRollbackAt:
                format: date-time
                type: string
              nextAttempt:
                description: |-
                  NextAttempt: no rollout starts before this. Set to LastRollbackAt +
                  Spec.Cooldown after a rollback or an unverifiable upgrade, and to one
                  poll interval after an aborted preflight. Clear it to retry sooner.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              resolved:
                additionalProperties:
                  description: ResolvedImage is a track resolved against the registry.
                  properties:
                    digest:
                      description: Digest is the image index digest.
                      type: string
                    pinned:
                      description: Pinned is true when this came from a pin.
                      type: boolean
                    platforms:
                      description: Platforms in the index, os/arch.
                      items:
                        type: string
                      type: array
                    repo:
                      type: string
                    revision:
                      description: Revision is the org.opencontainers.image.revision
                        label.
                      type: string
                    tag:
                      type: string
                    version:
                      description: |-
                        Version is a human label: the semver tag, or <line>-<revision12> for a
                        moving tag (v6-latest → v6-5d26aa998c80).
                      type: string
                  required:
                  - digest
                  - repo
                  type: object
                description: Resolved caches every distinct track resolution, keyed
                  by repo|track|pin.
                type: object
              rollout:
                description: Rollout is non-nil while a rollout is in progress.
                properties:
                  baselineRestarts:
                    description: BaselineRestarts is the container restart count when
                      the gate passed.
                    format: int32
                    type: integer
                  digest:
                    type: string
                  done:
                    description: Done lists targets finished in this rollout.
                    items:
                      type: string
                    type: array
                  failures:
                    description: Failures counts consecutive measured soak failures
                      (two fail the soak).
                    type: integer
                  image:
                    description: Image is what this target is being moved to.
                    type: string
                  index:
                    description: Index into Spec.Targets of the target being worked
                      on.
                    type: integer
                  previousAnnotations:
                    additionalProperties:
                      type: string
                    description: |-
                      PreviousAnnotations are the version annotations before the change, so a
                      rollback restores them exactly.
                    type: object
                  previousImage:
                    description: PreviousImage is the rollback target (digest-pinned).
                    type: string
                  previousVersion:
                    type: string
                  reason:
                    description: Reason records why a rollback is in progress.
                    type: string
                  snapshot:
                    description: Snapshot is every agent's placement before the change.
                    items:
                      description: AgentPlacementSnapshot is one agent's placement
                        captured before a rollout.
                      properties:
                        backend:
                          type: string
                        effort:
                          type: string
                        model:
                          type: string
                        name:
                          type: string
                        paused:
                          type: boolean
                      required:
                      - name
                      - paused
                      type: object
                    type: array
                  startedAt:
                    format: date-time
                    type: string
                  step:
                    description: RolloutStep is where an active rollout is for its
                      current target.
                    enum:
                    - Preflight
                    - Patching
                    - Rolling
                    - Soaking
                    - RollingBack
                    type: string
                  stepSince:
                    description: StepSince is when Step was entered.
                    format: date-time
                    type: string
                  target:
                    description: Target is the name at Index, to detect a reordered
                      spec.
                    type: string
                  version:
                    type: string
                required:
                - digest
                - image
                - index
                - startedAt
                - step
                - stepSince
                - target
                type: object
              targets:
                items:
                  description: ReleaseTargetStatus is the observed state of one target.
                  properties:
                    appliedImage:
                      description: |-
                        AppliedImage is the last image the operator wrote. A different live image
                        is drift.
                      type: string
                    container:
                      type: string
                    currentDigest:
                      type: string
                    currentImage:
                      type: string
                    currentVersion:
                      description: |-
                        CurrentVersion is derived from the running image (tag, or registry
                        revision for moving tags), never from the version annotation alone.
                      type: string
                    deployment:
                      type: string
                    desiredImage:
                      type: string
                    desiredVersion:
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    phase:
                      description: ReleasePhase is a target's position in the rollout
                        state machine.
                      enum:
                      - Current
                      - Pending
                      - Held
                      - Rolling
                      - Soaking
                      - RolledBack
                      - Failed
                      - Drifted
                      - Unknown
                      type: string
                    placementsRestored:
                      description: |-
                        PlacementsRestored lists agents whose backend/model the operator re-applied
                        after the image change reset them.
                      items:
                        type: string
                      type: array
                    since:
                      format: date-time
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
