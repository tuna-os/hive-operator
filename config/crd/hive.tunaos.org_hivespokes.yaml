---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: hivespokes.hive.tunaos.org
spec:
  group: hive.tunaos.org
  names:
    kind: HiveSpoke
    listKind: HiveSpokeList
    plural: hivespokes
    shortNames:
    - spoke
    singular: hivespoke
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.namespace
      name: Namespace
      type: string
    - jsonPath: .spec.org
      name: Org
      type: string
    - jsonPath: .status.agents[*]
      name: Agents
      priority: 1
      type: integer
    - jsonPath: .status.budgetPctUsed
      name: Budget%
      type: string
    - jsonPath: .status.budgetExhausted
      name: Exhausted
      type: boolean
    - jsonPath: .status.reachable
      name: Reachable
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HiveSpoke is one hive instance in the fleet.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HiveSpokeSpec is the desired state of one hive instance.
            properties:
              agentTiers:
                additionalProperties:
                  type: string
                description: |-
                  AgentTiers maps agent → tier (T1/T2/T3). An agent with no tier is never
                  placed. Default: hive-rotate.sh's AGENT_TIERS table.
                type: object
              budget:
                description: Budget caps weekly token spend. Omit or set 0 for uncapped.
                properties:
                  criticalPct:
                    default: 90
                    format: int32
                    type: integer
                  periodDays:
                    default: 7
                    format: int32
                    type: integer
                  weeklyTokens:
                    format: int64
                    type: integer
                type: object
              contributorNamespace:
                description: |-
                  ContributorNamespace holds the fleet-wide contributor Deployments the
                  PRIMARY spoke scales with provider headroom. Default hive-contributors.
                type: string
              holds:
                description: |-
                  Holds lists agents allowed to remain paused. Anything else found paused
                  through the dashboard API is resumed: an undeclared hand pause is not
                  durable state, it is how a spoke goes silently idle. Declaring a hold
                  here makes it reviewable and survives a pod rebuild.
                items:
                  type: string
                type: array
              installationID:
                description: |-
                  InstallationID is the GitHub App installation. Exactly one per spoke:
                  a repo under an account this installation does not cover 401-loops, and
                  that is a hard constraint of the hive config, not something to route
                  around per-repo.
                type: string
              ladderRef:
                description: LadderRef selects the ModelLadder this spoke places agents
                  from.
                type: string
              namespace:
                description: Namespace the hive Deployment runs in.
                type: string
              org:
                description: Org is the GitHub account or organisation this spoke
                  acts on.
                type: string
              pace:
                description: |-
                  Pace tunes the burn-rate pacer (hive-pace.sh). It runs under
                  RotationMode: Shadow plans, Enforce actuates this spoke's agents.
                properties:
                  disableKiroBudget:
                    description: |-
                      DisableKiroBudget paces Kiro with the generic fit instead of its credit
                      budget (HIVE_PACE_KIRO_BUDGET=0).
                    type: boolean
                  disabled:
                    type: boolean
                  evictTargetMaxPct:
                    description: 'EvictTargetMaxPct: a pool is a cap target only below
                      this. Default 85.'
                    format: int32
                    type: integer
                  fleetOrder:
                    description: |-
                      FleetOrder places this spoke in the fleet-wide pace order
                      (HIVE_PACE_NAMESPACES "hive hive-reef hive-hanthor"): one notch per
                      provider per tick goes to the FIRST eligible agent in that order. Lower
                      first; ties by namespace.
                    format: int32
                    type: integer
                  intervalMinutes:
                    description: IntervalMinutes between pace ticks (the CronJob ran
                      5,25,45). Default 20.
                    format: int32
                    type: integer
                  kiroEvictTTLSeconds:
                    description: 'KiroEvictTTLSeconds: how long a cap request stands.
                      Default 21600.'
                    format: int32
                    type: integer
                  kiroMaxDemote:
                    description: Kiro demotions per tick. Default 4.
                    format: int32
                    type: integer
                  kiroMaxEvict:
                    description: Kiro cap requests (move off Kiro) per tick. Default
                      2.
                    format: int32
                    type: integer
                  kiroMaxPromote:
                    description: Kiro promotions per tick. Default 1.
                    format: int32
                    type: integer
                  kiroPromoteMax:
                    description: |-
                      KiroPromoteMax: promote only if the projected burn/allowed stays at or
                      under this. Decimal string, default "0.8".
                    type: string
                type: object
              pins:
                description: Pins fix individual agents' placement against rotation
                  and healing.
                items:
                  description: |-
                    AgentPin fixes one agent's placement. Rotation must leave a pinned agent's
                    rung alone, and healing must not "repair" it back onto the ladder.

                    This exists because a pin that anything else can overwrite is not a pin. The
                    hive config carries a `cli_pinned` field that the rotation script never read,
                    so a model set through the dashboard was reverted within 20 minutes; the
                    watchdog then rewrote it again, because its repair path only ever selects a
                    tier member and therefore can never restore a deliberately off-ladder choice.
                  properties:
                    agent:
                      description: Agent is the agent name, e.g. "supervisor".
                      type: string
                    backend:
                      description: |-
                        Backend is the CLI that runs it: claude, codex, agy, pi. Optional:
                        rotation only needs to know the agent is pinned (HIVE_ROTATE_PIN names
                        agents, not placements); Backend/Model document the intended pair.
                      type: string
                    model:
                      description: |-
                        Model is the exact id the backend accepts. It need NOT be on the ladder —
                        pinning supervisor to gpt-5.4-mini (the only codex model with no service
                        tier, and so unmetered) is the motivating case.
                      type: string
                    reason:
                      description: Reason is free text, surfaced in the dashboard
                        and in events.
                      type: string
                  required:
                  - agent
                  type: object
                type: array
              primarySpoke:
                description: |-
                  PrimarySpoke names the spoke that owns fleet-wide resources (the
                  contributor pool). A non-primary spoke must skip contributor
                  reconciliation or two controllers fight over the same replicas.
                type: string
              repos:
                description: |-
                  Repos this spoke manages. Curated deliberately — a repo enumerator cannot
                  infer "the handful I am actively committing to".
                items:
                  type: string
                type: array
              rotation:
                description: Rotation tunes the placement policy. Every default is
                  hive-rotate.sh's.
                properties:
                  agyMaxHighVolume:
                    description: AgyMaxHighVolume caps high-volume agents on google
                      per tick. Default 5.
                    format: int32
                    type: integer
                  canaryCooldownMinutes:
                    description: |-
                      CanaryCooldownMinutes keeps canaries off a pool rotation just left
                      because it was exhausted. Default 720.
                    format: int32
                    type: integer
                  disableAutoResume:
                    type: boolean
                  disableCanaries:
                    type: boolean
                  disableMeteredFailover:
                    type: boolean
                  highVolumeCadenceSeconds:
                    description: |-
                      HighVolumeCadenceSeconds: agents kicked at least this often are
                      high-volume — kept off openai (unless their provider is exhausted) and
                      capped on google. Default 1800.
                    format: int32
                    type: integer
                  intervalMinutes:
                    description: |-
                      IntervalMinutes between Enforce applies (the CronJobs ran every 20
                      minutes; /api/status lags a mutation by minutes, so chained applies
                      re-decide on stale state). The plan itself is recomputed every
                      reconcile. Default 20.
                    format: int32
                    type: integer
                  kiroMinCadenceSeconds:
                    description: |-
                      KiroMinCadenceSeconds: agents kicked more often than this never go on
                      kiro, and are not sticky there, unless their current provider is
                      positively exhausted. Default 900.
                    format: int32
                    type: integer
                  peakProviders:
                    description: |-
                      PeakProviders are avoided (softly) during PeakWindows. Default none
                      (DeepSeek, the only peak-priced pool, was dropped 2026-09-24).
                    items:
                      type: string
                    type: array
                  peakWindows:
                    description: PeakWindows, UTC weekdays, "HH:MM-HH:MM,…". Default
                      01:00-04:00,06:00-10:00.
                    type: string
                  thresholds:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: |-
                      Thresholds: provider → percent at which it counts as exhausted.
                      Defaults: openai 85, anthropic 90, google 90, kiro 95, other 85.
                    type: object
                type: object
              rotationMode:
                default: Shadow
                description: |-
                  RotationMode controls placement decisions for this spoke. Shadow records
                  the exact changes without applying them; Enforce performs the same plan.
                enum:
                - Observe
                - Shadow
                - Enforce
                type: string
              rotationUsageSource:
                description: |-
                  RotationUsageSource selects the provider readings rotation plans from:
                    UsagePool  (default) each provider's UsagePool .status.rotationReading:
                               ccleft's /readings reduced exactly as hive-lib.sh's
                               ccleft_probe does (HIVE_PROBE_SOURCE=ccleft, the bash
                               default), falling back per provider to the ConfigMap below
                               when the pool has no fresh reading. The ccusage sidecar is
                               NOT needed for this.
                    Probe      the hive/hive-provider-usage ConfigMap only.
                enum:
                - Probe
                - UsagePool
                type: string
            required:
            - namespace
            - org
            type: object
          status:
            description: HiveSpokeStatus is the observed state.
            properties:
              agents:
                items:
                  description: AgentState is the observed state of one agent.
                  properties:
                    backend:
                      type: string
                    cadence:
                      description: |-
                        Cadence as /api/status renders it ("5m", "2h"). Rotation keeps
                        high-volume agents (≤30m) off the subscription pools.
                      type: string
                    effort:
                      type: string
                    idleSeconds:
                      description: |-
                        IdleSeconds since the last kick. The single most useful number for
                        noticing a fleet that has quietly stopped: every other signal stayed green
                        through an eight-hour outage.
                      format: int64
                      type: integer
                    lastKick:
                      format: date-time
                      type: string
                    mode:
                      type: string
                    model:
                      type: string
                    name:
                      type: string
                    onDemand:
                      type: boolean
                    paused:
                      type: boolean
                    pausedReason:
                      type: string
                    pausedTrigger:
                      description: |-
                        PausedTrigger distinguishes why. NOTE it does NOT distinguish an operator
                        pause from rotation's own: rotation authenticates with the owner session
                        cookie, so a strand records exactly as a human pause does
                        (reason "manual pause", trigger "dashboard-api"). The stranded journal is
                        the only reliable discriminator.
                      type: string
                    pinned:
                      description: Pinned is true when Spec.Pins covers this agent.
                      type: boolean
                  required:
                  - name
                  - paused
                  type: object
                type: array
              budgetExhausted:
                description: |-
                  BudgetExhausted mirrors the governor's own suppression gate. When true the
                  governor stops kicking on purpose, and nothing should nudge past it.
                type: boolean
              budgetPctUsed:
                type: string
              budgetUsedTokens:
                format: int64
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              contributorPlanText:
                description: |-
                  ContributorPlanText is the contributors section of the plan (primary
                  spoke only), as hive-rotate.sh prints it.
                items:
                  type: string
                type: array
              hiveID:
                type: string
              journal:
                description: |-
                  Journal is rotation's and the pacer's memory, owned by this
                  controller once the spoke is in Enforce (the bash jobs kept it on the
                  hive-ops-state PVC). In Shadow it stays empty and the planner infers
                  pace demotions instead.
                properties:
                  canaryCooldown:
                    description: |-
                      CanaryCooldown: pools rotation evicted because they were exhausted
                      (canary-cool-<provider>).
                    items:
                      description: ProviderCooldown keeps canaries off a provider
                        until Until.
                      properties:
                        provider:
                          type: string
                        until:
                          format: date-time
                          type: string
                      required:
                      - provider
                      - until
                      type: object
                    type: array
                  kiroEvict:
                    description: 'KiroEvict: the pacer''s requests to move agents
                      off Kiro (kiro-evict).'
                    items:
                      description: KiroEvictRequest asks rotation to move an agent
                        off Kiro onto Targets.
                      properties:
                        agent:
                          type: string
                        expiry:
                          format: date-time
                          type: string
                        targets:
                          items:
                            type: string
                          type: array
                      required:
                      - agent
                      - expiry
                      - targets
                      type: object
                    type: array
                  paceDemoted:
                    description: |-
                      PaceDemoted: the ORIGINAL rung the pacer demoted each agent from
                      (pace-demoted). Rotation counts a demoted rung as in-tier; the pacer
                      restores only these.
                    items:
                      description: JournalPlacement is one journal row.
                      properties:
                        agent:
                          type: string
                        at:
                          format: date-time
                          type: string
                        backend:
                          type: string
                        inferred:
                          description: |-
                            Inferred: seeded from the placement itself when the spoke was
                            promoted (the bash journal was not imported), not written by an
                            action of this controller.
                          type: boolean
                        model:
                          type: string
                        provider:
                          type: string
                      required:
                      - agent
                      - backend
                      - model
                      type: object
                    type: array
                  stranded:
                    description: |-
                      Stranded: agents rotation paused because their provider ran dry and
                      no rung would take them (/state/…/stranded).
                    items:
                      description: JournalPlacement is one journal row.
                      properties:
                        agent:
                          type: string
                        at:
                          format: date-time
                          type: string
                        backend:
                          type: string
                        inferred:
                          description: |-
                            Inferred: seeded from the placement itself when the spoke was
                            promoted (the bash journal was not imported), not written by an
                            action of this controller.
                          type: boolean
                        model:
                          type: string
                        provider:
                          type: string
                      required:
                      - agent
                      - backend
                      - model
                      type: object
                    type: array
                type: object
              observedAt:
                format: date-time
                type: string
              pacePlan:
                description: |-
                  PacePlan is the pacer's actions for THIS spoke's agents at the last
                  pace tick.
                items:
                  description: RotationDecision is one auditable placement decision.
                  properties:
                    action:
                      description: 'Action: move, strand, resume or canary.'
                      type: string
                    agent:
                      type: string
                    applied:
                      type: boolean
                    error:
                      type: string
                    fromBackend:
                      type: string
                    fromEffort:
                      type: string
                    fromModel:
                      type: string
                    fromProvider:
                      type: string
                    reason:
                      type: string
                    toBackend:
                      type: string
                    toEffort:
                      type: string
                    toModel:
                      type: string
                    toProvider:
                      type: string
                  required:
                  - agent
                  - applied
                  - reason
                  - toBackend
                  - toModel
                  - toProvider
                  type: object
                type: array
              pacePlanText:
                description: |-
                  PacePlanText is the FLEET-wide pace plan as hive-pace apply prints it
                  (verdict table, kiro budget, actions, footer), for diffing against the
                  hive-pace job log.
                items:
                  type: string
                type: array
              paceTickAt:
                description: PaceTickAt is the last pace tick.
                format: date-time
                type: string
              providers:
                items:
                  description: ProviderState is a measured reading for one backend
                    provider.
                  properties:
                    note:
                      type: string
                    provider:
                      type: string
                    resetsAt:
                      format: date-time
                      type: string
                    usedPercent:
                      description: |-
                        UsedPercent is 0-100, or -1 when genuinely unmeasured.

                        The distinction matters more than it looks: "unmeasured" is not evidence
                        of exhaustion and must keep a provider eligible, while a positive reading
                        at 100 must evacuate it. Conflating them either strands a healthy fleet
                        or keeps filling a dead pool.
                      format: int32
                      type: integer
                  required:
                  - provider
                  - usedPercent
                  type: object
                type: array
              reachable:
                type: boolean
              rotationAppliedAt:
                description: RotationAppliedAt is the last Enforce apply (rotation.intervalMinutes).
                format: date-time
                type: string
              rotationInputs:
                description: |-
                  RotationInputs records what the plan was computed from ("Probe
                  hive/hive-provider-usage @ 2026-09-24T17:12:32Z"), so a disagreement
                  can be attributed to inputs rather than logic.
                type: string
              rotationPlan:
                description: |-
                  RotationPlan is replaced on every reconcile. In Shadow it is the exact
                  action set the controller would apply if promoted to Enforce.
                items:
                  description: RotationDecision is one auditable placement decision.
                  properties:
                    action:
                      description: 'Action: move, strand, resume or canary.'
                      type: string
                    agent:
                      type: string
                    applied:
                      type: boolean
                    error:
                      type: string
                    fromBackend:
                      type: string
                    fromEffort:
                      type: string
                    fromModel:
                      type: string
                    fromProvider:
                      type: string
                    reason:
                      type: string
                    toBackend:
                      type: string
                    toEffort:
                      type: string
                    toModel:
                      type: string
                    toProvider:
                      type: string
                  required:
                  - agent
                  - applied
                  - reason
                  - toBackend
                  - toModel
                  - toProvider
                  type: object
                type: array
              rotationPlanText:
                description: |-
                  RotationPlanText is the plan rendered exactly as `hive-rotate.sh plan`
                  prints it (agent lines + footer, without the contributors section), so
                  shadow output can be diffed against the bash job's log with plain diff.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
