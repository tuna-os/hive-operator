                items:
                  description: HousekeepingJobStatus is one job's observed state.
                  properties:
                    action:
                      description: Action is what this reconcile did (Enforce) or
                        would do (Shadow).
                      type: string
                    drift:
                      description: Drift lists the fields where live differs from
                        the render.
                      items:
                        type: string
                      type: array
                    lastScheduleTime:
                      format: date-time
                      type: string
                    lastSuccessfulTime:
                      format: date-time
                      type: string
                    name:
                      type: string
                    owned:
                      description: Owned is true once the CronJob carries this object's
                        ownerReference.
                      type: boolean
                    script:
                      description: Script SHA-256 (first 12 hex) of the ConfigMap
                        key; "missing" if absent.
                      type: string
                    state:
                      description: |-
                        State: InSync, Drifted, Missing, Unadopted (exists, not owned yet),
                        Conflict (owned by another controller), Pruned.
                      type: string
                    suspended:
                      type: boolean
                  required:
                  - name
                  - state
                  type: object
                type: array
              observedAt:
                format: date-time
                type: string
              pendingActions:
                description: PendingActions is what Enforce would do. Empty when in
                  sync.
                items:
                  type: string
                type: array
              retired:
                items:
                  description: RetiredCronJobStatus is one retirement's state.
                  properties:
                    message:
                      type: string
                    name:
                      type: string
                    state:
                      description: 'State: Gone, Blocked (not suspended / active jobs),
                        Deleted, WouldDelete.'
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
