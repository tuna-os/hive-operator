---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: sharedauths.hive.tunaos.org
spec:
  group: hive.tunaos.org
  names:
    kind: SharedAuth
    listKind: SharedAuthList
    plural: sharedauths
    shortNames:
    - sauth
    singular: sharedauth
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.consistent
      name: Consistent
      type: boolean
    - jsonPath: .status.observedAt
      name: Observed
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SharedAuth is one credential store shared across spokes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SharedAuthSpec describes one credential store shared across spokes.

              A single device-flow login should cover the whole fleet. Assembling that from
              hostPath PVs and symlinks has failed silently three distinct ways, none of
              which are visible by inspection — hence VerifyByWriteThrough, which is not
              optional.
            properties:
              agentHome:
                default: /data/home
                description: |-
                  AgentHome is the agents' home directory inside the hive pod.

                  Spell it out. Do NOT use $HOME: `kubectl exec` runs as root and $HOME is
                  /root, so every check silently inspects the wrong directory and reports a
                  healthy fleet as broken — and a broken one as repaired.
                type: string
              dirs:
                default:
                - .claude
                - .gemini
                - .codex
                description: Dirs under AgentHome that must resolve to the same storage
                  everywhere.
                items:
                  type: string
                type: array
              mode:
                default: Shadow
                description: Mode gates repairs.
                enum:
                - Observe
                - Shadow
                - Enforce
                type: string
              namespaces:
                description: Namespaces expected to see the same storage.
                items:
                  type: string
                type: array
              primaryNamespace:
                description: PrimaryNamespace is where the probe marker is written.
                type: string
              repairPermissions:
                default: true
                description: |-
                  RepairPermissions regroups and group-writes the shared dirs. Token refresh
                  REWRITES the credential file; without group write the refresh fails and
                  presents as an expired subscription.
                type: boolean
              repairTheme:
                default: true
                description: |-
                  RepairTheme sets a theme in .claude.json when unset, and creates the file
                  when missing. A null theme leaves hasCompletedOnboarding true while the
                  CLI stops at the theme picker on every launch, and the watchdog
                  kill+restarts it forever.
                type: boolean
            required:
            - namespaces
            - primaryNamespace
            type: object
          status:
            description: SharedAuthStatus is the observed state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consistent:
                type: boolean
              namespaces:
                items:
                  description: SharedAuthNamespaceStatus is the per-namespace verification
                    result.
                  properties:
                    credentialPresent:
                      type: boolean
                    message:
                      type: string
                    namespace:
                      type: string
                    shared:
                      additionalProperties:
                        type: boolean
                      description: |-
                        Shared is the result of an actual write-through test, never of an `ls`.
                        The same hostPath string can resolve to a different filesystem for a
                        freshly created mount, and the wrong one looks perfectly plausible.
                      type: object
                    themeSet:
                      type: boolean
                  required:
                  - namespace
                  type: object
                type: array
              observedAt:
                format: date-time
                type: string
              pendingRepairs:
                description: |-
                  PendingRepairs is what Enforce mode would do. In Shadow this is the whole
                  output of the controller.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
