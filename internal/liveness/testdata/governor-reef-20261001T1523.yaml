governor:
    modes:
        busy:
            adjudicator: 30m
            architect: 30m
            brainstorm: 1h
            ci-maintainer: 3h
            guide: 1h
            operations: paused
            outreach: paused
            quality: 3h
            reviewer: 30m
            scanner: 1h
            sec-check: 2h
            strategist: paused
            supervisor: paused
            telemetry: paused
            threshold: 5
        idle:
            adjudicator: 30m
            architect: 2h
            brainstorm: 1h
            ci-maintainer: 3h
            guide: 4h
            operations: paused
            outreach: paused
            quality: 3h
            reviewer: 30m
            scanner: 1h
            sec-check: 2h
            strategist: paused
            supervisor: paused
            telemetry: paused
            threshold: 0
        quiet:
            adjudicator: 30m
            architect: 3h
            brainstorm: 1h
            ci-maintainer: 3h
            guide: 4h
            operations: paused
            outreach: paused
            quality: 3h
            reviewer: 30m
            scanner: 1h
            sec-check: 2h
            strategist: paused
            supervisor: paused
            telemetry: paused
            threshold: 2
        surge:
            adjudicator: 30m
            architect: 15m
            brainstorm: 1h
            ci-maintainer: 3h
            guide: 1h
            operations: paused
            outreach: paused
            quality: 3h
            reviewer: 30m
            scanner: 1h
            sec-check: 2h
            strategist: paused
            supervisor: paused
            telemetry: paused
            threshold: 10
    eval_interval_s: 120
    labels:
        exempt:
            - nightly-tests
            - LFX
            - meta-tracker
            - auto-qa-tuning-report
            - adopters
            - changes-requested
            - waiting-on-author
        automerge: lgtm
    sensing:
        gh_rate_patterns:
            - API rate limit exceeded
            - secondary rate limit
            - 403.*rate limit
            - You have exceeded a secondary rate
            - retry-after:[[:space:]]*[0-9]
            - 'gh: Resource not accessible'
            - abuse detection mechanism
        cli_exclude_patterns:
            - You.re out of extra usage
            - out of extra usage
            - extra usage.*resets
            - resets [0-9]+(:[0-9]+)?[aApP][mM]
        login_patterns: []
        ttl_seconds: 900
        pullback_seconds: 900
    watchdog:
        probe_interval_s: 300
    health:
        model_lock: false
    budget:
        total_tokens: 0
        period_days: 7
        critical_pct: 90
    logging:
        dir: /data/logs
        max_size_mb: 50
        max_age_days: 7
        max_backups: 10
        compress: true
        level: info
    litellm:
        endpoint: ""
        api_key_env: ""
        api_key_file: ""
        default_model: ""
        ca_bundle: ""
        local_proxy: false
    vllm:
        api_key_env: ""
        api_key_file: ""
    llm-d:
        api_key_env: ""
        api_key_file: ""
    bob:
        api_key_env: ""
        api_key_file: ""
    trajectory:
        enabled: null
        endpoint: ""
        api_key_env: ""
        api_key_file: ""
        interval_s: 0
        model: ""
        transcript_lines: 0
        on_divergence: pause
        exempt_agents: []
    replan:
        enabled: null
        interval_s: 0
        stall_threshold_s: 0
        max_replans: 0
    gateways: []
    thresholds_source: pack
    advisory:
        max_findings: 10
        show_all: false
        staleness_days: 7
        pr_autoclose: true
github:
