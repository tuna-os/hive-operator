  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      creationTimestamp: "2026-10-01T07:19:24Z"
      generation: 1
      name: hive-data-janitor
      namespace: hive
      uid: 1e40635c-c617-416f-8a25-646adbcb19df
    spec:
      concurrencyPolicy: Allow
      failedJobsHistoryLimit: 3
      jobTemplate:
        metadata: {}
        spec:
          activeDeadlineSeconds: 600
          template:
            metadata: {}
            spec:
              containers:
                - command:
                    - sh
                    - -c
                    - |
                      echo "--- before ---"; df -h /data | tail -n 1
                      for p in /data/home/.cache /data/home/.npm /data/home/.*.local-pre-shared-*; do
                        [ -e "$p" ] || continue
                        echo "pruning $p ($(du -sh "$p" | cut -f1))"
                        rm -rf "$p"
                      done
                      echo "--- after ---"; df -h /data | tail -n 1
                  image: busybox:1.36
                  imagePullPolicy: IfNotPresent
                  name: janitor
                  resources:
                    limits:
                      cpu: 50m
                      memory: 64Mi
                    requests:
                      cpu: 50m
                      memory: 64Mi
                  terminationMessagePath: /dev/termination-log
                  terminationMessagePolicy: File
                  volumeMounts:
                    - mountPath: /data
                      name: data
              dnsPolicy: ClusterFirst
              restartPolicy: Never
              schedulerName: default-scheduler
              securityContext: {}
              terminationGracePeriodSeconds: 30
              tolerations:
                - effect: NoSchedule
                  key: node.kubernetes.io/disk-pressure
                  operator: Exists
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
              volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: hive-data
      schedule: 23 4 * * 0
      successfulJobsHistoryLimit: 3
      suspend: false
